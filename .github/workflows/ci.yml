# CI：lint + 单元测试 + Debug 构建
# 不跑 assembleRelease：签名凭据（ANDROID_KEYSTORE 等）不入 CI，release 产物本地构建
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Lint、单元测试与 Debug 构建
        run: ./gradlew lint test assembleDebug
